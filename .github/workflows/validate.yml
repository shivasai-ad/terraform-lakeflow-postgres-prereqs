name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.11" # the test suite uses override_during (Terraform 1.11+)

      - name: Format
        run: terraform fmt -check -recursive

      - name: Module - init, validate, test
        working-directory: modules/postgres_cdc_source
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Root - init, validate
        run: |
          terraform init -backend=false
          terraform validate

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/*.sh
